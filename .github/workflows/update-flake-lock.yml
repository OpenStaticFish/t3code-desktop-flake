name: Update flake.lock

on:
  schedule:
    # Daily at 04:37 UTC (off-round time to avoid GitHub runner load).
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update flake.lock and commit
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          nix flake update

          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already up to date; nothing to commit."
            exit 0
          fi

          git add flake.lock
          git commit -m "chore(flake): daily flake.lock update"
          git push origin "HEAD:${DEFAULT_BRANCH}"
